# RIPE Atlas Webcockpit aliases for the existing Turris lighttpd service.
alias.url += (
  "/ripe-atlas/" => "/usr/share/ripe-atlas-webcockpit/current/"
)

$HTTP["url"] =~ "^/ripe-atlas/" {
  setenv.add-response-header += (
    "Content-Security-Policy" => "default-src 'self'; connect-src 'self' https://atlas.ripe.net; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'",
    "Referrer-Policy" => "no-referrer",
    "X-Content-Type-Options" => "nosniff"
  )
}

$HTTP["url"] == "/cgi-bin/ripe-atlas-webcockpit" {
  cgi.assign = ( "" => "" )
}
